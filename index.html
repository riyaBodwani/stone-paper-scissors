
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Stone Paper Scissors</h1>
        <p class="subtitle">Choose your move and challenge the computer!</p>

        <div class="scoreboard">
            <div>
                <h2 id="player-score">0</h2>
                <p>You</p>
            </div>
            <div>
                <h2 id="computer-score">0</h2>
                <p>Computer</p>
            </div>
        </div>

        <div class="choices">
            <button onclick="playGame('stone')">✊ Stone</button>
            <button onclick="playGame('paper')">✋ Paper</button>
            <button onclick="playGame('scissors')">✌ Scissors</button>
        </div>

        <div class="result">
            <p id="player-choice">Your choice: -</p>
            <p id="computer-choice">Computer's choice: -</p>
            <h2 id="result-message">Make your move!</h2>
        </div>

        <button class="reset-btn" onclick="resetGame()">Restart Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
